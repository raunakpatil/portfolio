<!doctype html>
<!-- The site's share image (img/og.png, 1200x630: what a link to raunakpatil.com shows). Rendered by
     scripts/build-og.mjs. Edit this, then run it again.
     Everything that matters sits in the middle 630x630 square: chat apps (WhatsApp, Telegram) show only a square cut
     from the centre, LinkedIn and X the whole card. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  /* a warm paper white, lit from the middle, the corners a shade deeper */
  body { position: relative; color: #141414; font-family: "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(70% 95% at 50% 42%, #fbfaf7 0%, #f1efea 62%, #e6e3dc 100%); }
  /* two fine rings behind the photo, the only ornament */
  .ring { position: absolute; left: 50%; top: 200px; border-radius: 50%; translate: -50% -50%; border: 1px solid rgba(20, 20, 20, .07); }
  .ring.a { width: 330px; height: 330px; }
  .ring.b { width: 470px; height: 470px; border-color: rgba(20, 20, 20, .045); }
  .col { position: absolute; left: 50%; top: 102px; width: 640px; translate: -50% 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .photo { position: relative; width: 196px; height: 196px; border-radius: 50%; padding: 6px; background: #fff;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 18px 40px -12px rgba(60, 50, 30, .28), 0 0 0 1px rgba(20, 20, 20, .06); }
  .photo span { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.9); transform-origin: 50% 27%; }   /* (close on the face) */
  .photo b { position: absolute; right: 14px; bottom: 14px; width: 22px; height: 22px; border-radius: 50%; background: #22c55e; border: 4px solid #fff; }   /* (open to work) */
  h1 { margin-top: 34px; font-weight: 400; font-size: 84px; line-height: 1; letter-spacing: -.035em; }   /* (the site's own page-title type) */
  .role { margin-top: 16px; font-size: 17px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: #6f6a62; }
  .rule { width: 56px; height: 1px; margin: 26px 0 22px; background: #c9c3b8; }
  .foot { display: flex; align-items: center; gap: 14px; font-size: 19px; color: #6f6a62; }
  .foot i { width: 3px; height: 3px; border-radius: 50%; background: #b5aea3; }
  .foot .on { display: inline-flex; align-items: center; gap: 8px; color: #1e7a45; }
  .foot .on::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; }
</style>
</head>
<body>
  <div class="ring a"></div><div class="ring b"></div>
  <div class="col">
    <div class="photo"><span><img src="photo.png" alt=""></span><b></b></div>
    <h1>Raunak Patil</h1>
    <div class="role">AI Quality Engineer</div>
    <div class="rule"></div>
    <div class="foot"><span class="on">Open to work</span><i></i><span>LLMs, RAG &amp; AI agents</span><i></i><span>raunakpatil.com</span></div>
  </div>
</body>
</html>
