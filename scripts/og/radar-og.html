<!doctype html>
<!-- Radar's share image (img/radar-og.png, 1200x630): rendered by scripts/build-og.mjs. Edit this, then run it again. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --neu-out: -6px -6px 14px rgba(255, 255, 255, .95), 6px 6px 14px rgba(163, 168, 186, .55); --key: inset 0 1px 1px rgba(255, 255, 255, .18), 0 3px 8px rgba(0, 0, 0, .22); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #f2f2f2; color: #111; font-family: "Inter Tight", system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 64px 72px; }
  /* a faint radar behind it all, top right */
  .dial { position: absolute; right: -170px; top: -170px; width: 640px; height: 640px; border-radius: 50%; border: 1.5px solid rgba(0, 0, 0, .07); }
  .dial::before, .dial::after { content: ""; position: absolute; border-radius: 50%; border: 1.5px solid rgba(0, 0, 0, .06); }
  .dial::before { inset: 110px; }
  .dial::after { inset: 220px; }
  .sweep { position: absolute; right: -170px; top: -170px; width: 640px; height: 640px; border-radius: 50%; background: conic-gradient(from 150deg, transparent, rgba(255, 122, 26, .2) 60deg, transparent 61deg); }
  .top { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: #8a8a8a; }
  .mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #111; box-shadow: var(--key); }
  .mark svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; }
  h1 { margin-top: 46px; font-size: 92px; font-weight: 400; letter-spacing: -.035em; line-height: 1; }
  h1 em { font-style: normal; color: #9a9a9a; }
  p { margin-top: 24px; font-size: 29px; line-height: 1.35; color: #555; max-width: 900px; }
  .row { position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; align-items: center; gap: 14px; }
  .ic { width: 64px; height: 64px; border-radius: 17px; background: #fff; box-shadow: var(--neu-out); display: grid; place-items: center; }
  .ic img { width: 38px; height: 38px; border-radius: 8px; }
  .url { margin-left: auto; padding: 16px 26px; border-radius: 999px; background: #111; color: #fff; font-size: 25px; box-shadow: var(--key); }
</style>
</head>
<body>
  <div class="dial"></div><div class="sweep"></div>
  <div class="top"><span class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6" opacity=".45"/><path d="M12 12 18.4 5.6"/><circle cx="15.6" cy="15.2" r="1.4" fill="#fff" stroke="none"/></svg></span>Radar</div>
  <h1>Best AI tools<br><em>on the Radar</em></h1>
  <p id="sub">6,300+ AI tools ranked by category, a Top 50 and new releases, plus the latest AI news. Updated every week.</p>
  <div class="row">
    <span class="ic"><img src="../../img/tools/chatgpt.webp" alt=""></span>
    <span class="ic"><img src="../../img/tools/claude.webp" alt=""></span>
    <span class="ic"><img src="../../img/tools/gemini.webp" alt=""></span>
    <span class="ic"><img src="../../img/tools/cursor.webp" alt=""></span>
    <span class="ic"><img src="../../img/tools/midjourney.webp" alt=""></span>
    <span class="ic"><img src="../../img/tools/runway.webp" alt=""></span>
    <span class="ic"><img src="../../img/tools/elevenlabs.webp" alt=""></span>
    <span class="ic"><img src="../../img/tools/suno.webp" alt=""></span>
    <span class="url">raunakpatil.com/radar</span>
  </div>
</body>
</html>
