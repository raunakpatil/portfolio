# Ronie's chat worker — deploy with:  cd worker && npx wrangler deploy
name = "ronie-chat"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[ai]
binding = "AI"

# 30 chat or game turns per minute per visitor (game answers come quickly)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# the Tools page's feed (src/feed.js): rebuilt every half hour into KV, so /feed answers at once
[[kv_namespaces]]
binding = "FEED"
id = "08e09fa0db2a4372bf3974b7042f3667"

[triggers]
crons = ["*/30 * * * *"]
