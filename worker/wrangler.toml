# Ronie's chat worker — deploy with:  cd worker && npx wrangler deploy
name = "ronie-chat"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[ai]
binding = "AI"

# 30 chat or game turns per minute per visitor (game answers come quickly)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# the quick voice: up to 40 spoken lines per minute per visitor
[[ratelimits]]
name = "VOICE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 40
  period = 60
